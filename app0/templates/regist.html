
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — NerpaMed</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header>
        <a href="{% url 'main' %}">
            <img src="{% static 'img/Nerpa.png' %}" alt="NerpaMed" height="100" width="100" style="border-radius: 50%;">
        </a>

        <div class="men">
            <a href="{% url 'lk' %}">Личный кабинет</a>
            <a href="{% url 'med' %}">Наши врачи</a>
            <a href="{% url 'table' %}">Расписание</a>
            <a href="{% url 'logout' %}" class="login-btn">Выход</a>
        </div>
    </header>

    <main class="reg-main">
        <h1>Регистрация пациента</h1>
        <p>Создайте аккаунт, чтобы записываться на приём к нашим врачам.</p>

        {% if error %}
            <p class="reg-error">{{ error }}</p>
        {% endif %}

        <form class="reg-form" method="POST" action="{% url 'regist' %}">
            {% csrf_token %}

            <div>
                <label for="username">Логин *</label>
                <input type="text" id="username" name="username" required value="{{ request.POST.username }}">
            </div>

            <div>
                <label for="first_name">Имя *</label>
                <input type="text" id="first_name" name="first_name" required value="{{ request.POST.first_name }}">
            </div>

            <div>
                <label for="last_name">Фамилия *</label>
                <input type="text" id="last_name" name="last_name" required value="{{ request.POST.last_name }}">
            </div>

            <div>
                <label for="email">Электронная почта *</label>
                <input type="email" id="email" name="email" required value="{{ request.POST.email }}">
            </div>

            <div>
                <label for="phone">Телефон *</label>
                <input type="tel" id="phone" name="phone" required value="{{ request.POST.phone }}">
            </div>

            <div>
                <label for="birth_date">Дата рождения</label>
                <input type="date" id="birth_date" name="birth_date" value="{{ request.POST.birth_date }}">
            </div>

            <div>
                <label for="address">Адрес</label>
                <input type="text" id="address" name="address" value="{{ request.POST.address }}">
            </div>

            <div>
                <label for="password1">Пароль *</label>
                <input type="password" id="password1" name="password1" required>
            </div>

            <div>
                <label for="password2">Повторите пароль *</label>
                <input type="password" id="password2" name="password2" required>
            </div>

            <button type="submit">Зарегистрироваться</button>
        </form>

        <p class="reg-login">Уже есть аккаунт? <a href="{% url 'bxod' %}">Войти</a></p>
    </main>

</body>
</html>
