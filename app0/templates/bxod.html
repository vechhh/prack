
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'main' %}">
            <img src="{% static 'img/Nerpa.png' %}" alt="NerpaMed" height="100" width="100" style="border-radius: 50%;">
        </a>
        <div class="men">
            <a href="{% url 'lk' %}">Личный кабинет</a>
            <a href="{% url 'med' %}">Наши врачи</a>
            <a href="{% url 'table' %}">Расписание</a>
            <a href="{% url 'bxod' %}">Вход</a>
        </div>
    </header>

    <main>
        <h1>Вход в личный кабинет</h1>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <p>
                <label for="username">Логин:</label><br>
                <input type="text" id="username" name="username" required>
            </p>

            <p>
                <label for="password">Пароль:</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <button type="submit">Войти</button>
        </form>

        <p>
            Нет аккаунта?
            <a href="{% url 'regist' %}">Зарегистрироваться</a>
        </p>
    </main>
</body>
</html>
